# xbug_noreset — X-trace fixture, class 1 (register never reset / never assigned).
[project]
name = "xbug_noreset"
top = "xn_top"
tb_top = "tb_xn"
sources = { glob = ["rtl/*.sv"] }
tb_sources = { glob = ["tb/*.sv"] }
clock = "clk"
reset = { name = "rst", active = "high" }

# Verilator is 2-state: it never shows the X. The X-trace goldens are produced
# with a 4-state simulator (iverilog: `make sim-iverilog`, or VCS).
[flows.sim.verilator]
mode = "builtin"
waves = "waves.vcd"
tests = { names = ["smoke"] }

[flows.sim.vcs]
mode = "wrap"
cmd = "make sim-vcs TEST={test}"
waves = "waves.vcd"
tests = { names = ["smoke"] }
