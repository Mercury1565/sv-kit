# svkit project file for the `pipe5` fixture: a toy 5-stage pipeline for the invented T8 ISA.
# Tests are the programs in programs/*.mem; `ldst_fwd` FAILS on purpose (planted hazard bug,
# see fixtures/README.md) so the "open a failing test at its divergence" view has a target.

[project]
name = "pipe5"
top = "p5_core"
tb_top = "p5_tb"
sources = { glob = ["rtl/*.sv"] }      # svkit puts files declaring a `package` first
tb_sources = { glob = ["tb/*.sv"] }
clock = "clock"
reset = { name = "reset", active = "high" }
workdir_exclude = ["output", "build", "syn_out"]

# ---------------------------------------------------------------- simulation
[flows.sim.verilator]
mode = "builtin"
waves = "output/{test}.vcd"
golden = { actual = "output/{test}.wb", expected = "expected/{test}.wb", time_regex = '^@(\d+)', time_unit = "cycle" }
tests = { glob = "programs/*.mem" }

[flows.sim.vcs]
mode = "wrap"
cmd = "make sim-vcs TEST={test}"
log = "vcs_out/{test}.log"
waves = "output/{test}.vcd"
golden = { actual = "output/{test}.wb", expected = "expected/{test}.wb", time_regex = '^@(\d+)', time_unit = "cycle" }
tests = { glob = "programs/*.mem" }

# ---------------------------------------------------------------- synthesis / timing
[flows.synth.yosys]
mode = "builtin"
sta = "opensta"

[flows.synth.dc]
mode = "wrap"
cmd = "make syn-dc"
script = "synopsys/syn.tcl"
reports = ["syn_out/{top}.rep"]
netlist = "syn_out/{top}.vg"
log = "syn_out/{top}.log"
license_seats = 1

[flows.sta.opensta]
max_paths = 5

# ---------------------------------------------------------------- knobs / experiments
[knobs]
clock_period = { file = "clock_period.txt", unit = "ps", default = 2000 }
corner = { tcl_var = "corner", default = "TT" }
dont_use = { tcl_var = "svkit_dont_use", default = "" }
# DC only: replace the compile command, e.g. --set compile_cmd=compile_ultra
compile_cmd = { tcl_replace = '^compile\b.*$', with = "{value}" }

[experiments]
baseline = {}
ss_corner = { corner = "SS" }
rvt_only = { dont_use = "*_L", tcl_append = "set_dont_use [get_lib_cells */*_L]" }   # yosys: dont_use; DC: tcl_append

# ---------------------------------------------------------------- perf (CPI / TPI)
[perf.source]
regex_file = "output/{test}.cpi"
cycles = 'cycles\s*=\s*(\d+)'
instrs = 'instrs\s*=\s*(\d+)'
stalls = { load_use = 'load_use_stalls\s*=\s*(\d+)', branch = 'branch_flushes\s*=\s*(\d+)' }

[library]
vt_suffix = { "_R" = "RVT", "_L" = "LVT" }
liberty = ["../lib/svkit_tiny.lib"]
corners = { TT = ["../lib/svkit_tiny.lib"], SS = ["../lib/svkit_tiny_ss.lib"] }
