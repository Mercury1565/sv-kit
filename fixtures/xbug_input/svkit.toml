# xbug_input — X-trace fixture, class 4 (X/Z from the testbench).
[project]
name = "xbug_input"
top = "xi_top"
tb_top = "tb_xi"
sources = { glob = ["rtl/*.sv"] }
tb_sources = { glob = ["tb/*.sv"] }
clock = "clk"
reset = { name = "rst", active = "high" }

# Verilator is 2-state: it never shows the X. Goldens come from a 4-state simulator.
[flows.sim.verilator]
mode = "builtin"
waves = "waves.vcd"
tests = { names = ["smoke"] }

[flows.sim.vcs]
mode = "wrap"
cmd = "make sim-vcs TEST={test}"
waves = "waves.vcd"
tests = { names = ["smoke"] }
