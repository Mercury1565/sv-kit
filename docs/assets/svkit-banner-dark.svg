<svg xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200" role="img" aria-labelledby="t d">
<title id="t">svkit</title>
<desc id="d">svkit: debug and PPA workbench for SystemVerilog. The logo's square wave draws itself while a waveform scrolls under a cursor.</desc>
<style>
  .word { font: 700 66px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1px; fill: #e3e7ed; }
  .tag { font: 400 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9aa5b4; }
  .chips { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6b7685; }
  .n { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa5b4; }
  .v { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .grid { stroke: #1b2028; stroke-width: 1; }
  .draw { stroke-dasharray: 34; stroke-dashoffset: 34; animation: draw 6s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 34; } 22% { stroke-dashoffset: 0; } 82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -34; } }
  .scroll { animation: scroll 3.2s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-160px); } }
  .blink { animation: blink 1.6s steps(2, jump-none) infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .scroll, .blink { animation: none; }
  }
</style>
