# Publishing a tag vX.Y.Z creates the GitHub release that `svkit update` installs:
#     python3 scripts/release.py minor
#     git push origin main vX.Y.Z        # one tag per push: GitHub ignores pushes of more than 3 tags
# A tag that is already on GitHub without a release (e.g. pushed with many others):
#     Actions -> release -> Run workflow -> tag vX.Y.Z
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.18.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag matches svkit.__version__
        run: |
          v=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/svkit/__init__.py').read_text()).group(1))")
          test "v$v" = "$TAG" || { echo "tag $TAG but svkit.__version__ is $v"; exit 1; }

      - name: The release installs the way svkit update installs it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet "svkit @ file://$PWD"
          /tmp/v/bin/svkit --version
          test "$(/tmp/v/bin/python -c 'import svkit; print(svkit.__version__)')" = "${TAG#v}"
          /tmp/v/bin/python -c "import svkit, pathlib; assert (pathlib.Path(svkit.__file__).parent / 'server/static/index.html').is_file(), 'web assets missing'"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          # checkout can leave the tag lightweight; fetch the annotated tag to read its message
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          test -s notes.md || echo "svkit $TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "svkit $TAG" --notes-file notes.md
