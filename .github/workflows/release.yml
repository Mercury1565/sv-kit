# Publishing a tag vX.Y.Z (scripts/release.py, then `git push origin main --follow-tags`)
# creates the GitHub release that `svkit update` installs.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag matches svkit.__version__
        run: |
          v=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/svkit/__init__.py').read_text()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but svkit.__version__ is $v"; exit 1; }

      - name: The release installs the way svkit update installs it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet "svkit @ file://$PWD"
          /tmp/v/bin/svkit --version
          test "$(/tmp/v/bin/python -c 'import svkit; print(svkit.__version__)')" = "${GITHUB_REF_NAME#v}"
          /tmp/v/bin/python -c "import svkit, pathlib; assert (pathlib.Path(svkit.__file__).parent / 'server/static/index.html').is_file(), 'web assets missing'"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout can leave the tag lightweight; fetch the annotated tag to read its message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          test -s notes.md || echo "svkit $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "svkit $GITHUB_REF_NAME" --notes-file notes.md
